[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".git", "__pycache__", "data", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "PLC", "PLE", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
strict_optional = true
exclude = ["tests/"]
